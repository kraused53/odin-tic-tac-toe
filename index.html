<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Page Title Here</title>
        <link rel="stylesheet" href="./styles.css">
        <script src="./scripts.js" defer></script>
    </head>

    <body>
        
        <div id="page-container">
            <header>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>pound</title><path d="M5.41,21L6.12,17H2.12L2.47,15H6.47L7.53,9H3.53L3.88,7H7.88L8.59,3H10.59L9.88,7H15.88L16.59,3H18.59L17.88,7H21.88L21.53,9H17.53L16.47,15H20.47L20.12,17H16.12L15.41,21H13.41L14.12,17H8.12L7.41,21H5.41M9.53,9L8.47,15H14.47L15.53,9H9.53Z" /></svg>
                <h1 id="header">Tic-Tac-Toe</h1>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>pound</title><path d="M5.41,21L6.12,17H2.12L2.47,15H6.47L7.53,9H3.53L3.88,7H7.88L8.59,3H10.59L9.88,7H15.88L16.59,3H18.59L17.88,7H21.88L21.53,9H17.53L16.47,15H20.47L20.12,17H16.12L15.41,21H13.41L14.12,17H8.12L7.41,21H5.41M9.53,9L8.47,15H14.47L15.53,9H9.53Z" /></svg>
            </header>
            <main>
                <div id="left-pane">
                    <div id="message">
                        <h3>Jackie:</h3>
                        <p>
                            Hey choom, looks like you have some free time. 
                            How 'bout you hop on the net so we can play a few 
                            rounds of the old 'Tac?
                        </p>
                    </div>
                </div>
                <div id="right-pane">
                    <div id="board">
                        
                    </div>
                    <div id="controls">
                        <button type="button" id="name-button" class="control">Edit Names</button>
                        <button type="button" id="reset-button" class="control">Reset Game</button>
                        <p id="log" role="status" aria-live="polite"></p>
                    </div>
                </div>
            </main>
        </div>
        <dialog id="name-dialog">
            <form id="name-form">
                <h2>Edit Player Names</h2>

                <div class="form-field">
                    <label for="player-one-name">Player One (X)</label>
                    <input
                        type="text"
                        id="player-one-name"
                        name="player-one-name"
                        maxlength="30"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="player-two-name">Player Two (O)</label>
                    <input
                        type="text"
                        id="player-two-name"
                        name="player-two-name"
                        maxlength="30"
                        required
                    >
                </div>

                <div class="dialog-actions">
                    <button type="button" id="cancel-name-button">
                        Cancel
                    </button>
                    <button type="submit">
                        Save Names
                    </button>
                </div>
            </form>
        </dialog>
    </body>

</html>
